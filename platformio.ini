; Half Decent Espresso Scale — ESP32-S3 Super Mini breadboard
; Compatible with Flowlog (Decent Scale BLE protocol)
;
; Super Mini (common): ESP32-S3FH4R2 — 4MB flash + 2MB PSRAM
; partitions_4mb_ota.csv: dual OTA app slots (1.625 MB each) + 640 KB SPIFFS

[env:esp32-s3-super-mini]
; Pinned: Arduino-ESP32 core 2.x API (ledcSetup/ledcAttachPin). espressif32 >= 8 ships core 3.x.
platform = espressif32@7.1.3
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Leave upload_port unset so PlatformIO auto-detects ACM0/ACM1 after re-plug
; upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

; Match real silicon (esptool reports 4MB, not the 8MB DevKitM default)
board_upload.flash_size = 4MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = partitions_4mb_ota.csv

build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  ; 0 = no Arduino-library log strings (saves ~42 KB flash); our Serial
  ; messages are unaffected.
  -DCORE_DEBUG_LEVEL=0
  ; Link-time shims, see src/size_shims.cpp
  -Wl,--wrap=mbedtls_strerror
  -Wl,--wrap=sscanf

lib_deps =
  olkal/HX711_ADC@^1.2.12
  olikraus/U8g2@^2.35.19
  h2zero/NimBLE-Arduino@^1.4.2

monitor_filters =
  esp32_exception_decoder
  time

; Wireless firmware update once the scale is on your LAN.
; There is no compiled-in OTA password: each scale generates its own random
; password on first boot (shown on the OLED — hold Timer 5 s, or serial
; `auth show`). Pass it via the environment, never commit it:
;   export HALF_DECENT_OTA_PASSWORD='xxxx-xxxx-xxxx'
;   pio run -t upload -e ota --upload-port 192.168.x.x
;   pio run -t upload -e ota --upload-port half-decent.local
[env:ota]
extends = env:esp32-s3-super-mini
upload_protocol = espota
upload_port = half-decent.local
upload_flags =
  --auth=${sysenv.HALF_DECENT_OTA_PASSWORD}
